[workspace]
resolver = "2"
members = ["live-round"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MiroFish Arena contributors"]
license = "Apache-2.0"
repository = "https://github.com/kaankacar/mirofish"

[workspace.dependencies]
soroban-sdk = "23.0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
